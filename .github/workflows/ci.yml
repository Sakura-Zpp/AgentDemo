name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check app.py healthcheck.py agent model rag utils tests

      - name: Type check
        run: python -m mypy

      - name: Test
        run: python -m pytest

      - name: Compile
        run: python -m compileall -q app.py agent rag model utils

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies and Chromium
        run: |
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Start Streamlit
        env:
          DASHSCOPE_API_KEY: test-key-for-ui-smoke-only
          AGENT_CHECKPOINT_BACKEND: memory
        run: |
          nohup python -m streamlit run app.py --server.headless=true --server.fileWatcherType=none --server.port=8501 > /tmp/agent-demo-streamlit.log 2>&1 &
          for attempt in {1..30}; do
            python healthcheck.py && exit 0
            sleep 2
          done
          cat /tmp/agent-demo-streamlit.log
          exit 1

      - name: Browser end-to-end test
        env:
          E2E_BASE_URL: http://127.0.0.1:8501
        run: python -m pytest -m e2e tests/e2e

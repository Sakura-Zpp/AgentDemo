init_timeout: 30
execute_timeout: 120
default_agent: knowledge

checkpoint:
  backend: sqlite
  path: .agent_data/checkpoints.sqlite3
  dsn_env: AGENT_CHECKPOINT_DSN
  retention_days: 30
  max_threads: 500

mcp_server_timeout: 12

memory:
  enabled: true
  path: .agent_data/long_term_memory.sqlite3
  semantic_search: true
  top_k: 3
  min_score: 0.2
  retention_days: 180
  max_items_per_user: 200
  max_content_length: 2000
  embedding_timeout_seconds: 8

routing:
  report_keywords:
    - 报告
    - 财报
    - 总结
    - 分析
    - 图表
    - 趋势
    - 对比
    - 可视化
  utility_keywords:
    - 天气
    - 地图
    - 路线
    - 导航
    - 地址
    - 经纬度
    - 附近
  memory_keywords:
    - 请记住
    - 记住
    - 帮我记住
    - 请忘记
    - 忘记
    - 删除记忆
    - 查看记忆
    - 列出记忆
    - 你记得什么
    - 清除所有记忆
    - 清空长期记忆
    - "remember:"
    - "forget:"
    - list memories
    - clear all memories
  follow_up_phrases:
    - 继续
    - 继续说
    - 请继续
    - 详细一点
    - 再详细一点
    - 展开说说
    - 为什么
    - 还有吗
    - 然后呢
    - 再说说

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_demo
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY is required}
      AGENT_CHECKPOINT_BACKEND: postgres
      AGENT_CHECKPOINT_DSN: ${AGENT_CHECKPOINT_DSN:?AGENT_CHECKPOINT_DSN is required}
      LANGGRAPH_STRICT_MSGPACK: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - agent_data:/app/.agent_data
      - agent_logs:/app/log
      - knowledge_index:/app/chroma_db
    restart: unless-stopped

volumes:
  postgres_data:
  agent_data:
  agent_logs:
  knowledge_index:

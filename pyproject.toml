[build-system]
requires = ["setuptools==72.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-demo"
version = "0.2.0"
description = "基于 LangGraph 的多智能体企业知识库 Demo"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiosqlite==0.21.0",
    "dashscope==1.24.9",
    "langchain==1.0.3",
    "langchain-chroma==1.1.0",
    "langchain-classic==1.0.0",
    "langchain-community==0.4",
    "langchain-core==1.2.20",
    "langchain-mcp-adapters==0.2.2",
    "langchain-text-splitters==1.0.0",
    "langgraph==1.0.2",
    "langgraph-checkpoint==3.0.0",
    "langgraph-checkpoint-sqlite==3.0.0",
    "nest-asyncio==1.6.0",
    "pypdf==6.17.0",
    "python-dotenv==1.1.0",
    "PyYAML==6.0.2",
    "rank-bm25==0.2.2",
    "streamlit==1.45.1",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "playwright==1.62.0",
    "pytest==8.3.4",
    "pytest-playwright==0.9.0",
    "ruff==0.14.2",
    "types-PyYAML==6.0.12.20260906",
]
postgres = [
    "langgraph-checkpoint-postgres==3.0.0",
    "psycopg[binary,pool]==3.2.10",
]

[tool.setuptools.packages.find]
include = ["agent*", "model*", "rag*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "e2e: requires a running Streamlit server and Chromium",
    "load: bounded local concurrency/load verification",
]

[tool.mypy]
python_version = "3.11"
files = ["app.py", "healthcheck.py", "agent", "model", "rag", "utils"]
exclude = ["agent/react_agent.py"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
